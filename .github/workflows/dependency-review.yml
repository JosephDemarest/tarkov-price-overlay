name: Dependency audits

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm-production-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarkov-price-overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tarkov-price-overlay/package-lock.json
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarkov-price-overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit pinned Python dependencies
        run: pip-audit -r python-core/requirements.txt
